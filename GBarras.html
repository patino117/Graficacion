<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundation Starter Template</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Graficador 3.0</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Plano Cartesiano</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="GBarras.html">Gráfico de Barras</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="card text-center">
        <div class="card-header">
        </div>

        <div class="container mt-4">
            <div class="card p-3 shadow-sm mb-3">
                <div class="row g-2 align-items-center">

                    <div class="col-md-9">
                        <label class="form-label">Ingrese datos separados por comas:</label>
                        <input type="text" id="datos-input" class="form-control" value="100">
                    </div>

                    <div class="col-md-3 d-grid">
                        <button id="btn-graficar-barras" class="btn btn-primary mt-4">Graficar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="chart card-img-bottom">
            <canvas id="canvas-barras" width="640" height="480"></canvas>
        </div>
    </div>

    <div class="chart card-img-bottom">
        <canvas id="circlechart" width="640" height="480"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
        </script>
    <script src="./dist/src/mainBarras.js" type="module"></script>
</body>

</html>
